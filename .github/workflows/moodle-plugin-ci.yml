name: Moodle Plugin CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: moodle-plugin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (MOODLE_502_STABLE, mariadb)
    runs-on: [self-hosted, Linux, X64, dev-ci-runner]

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialise Moodle Plugin CI
        run: |
          CI_DIR="$RUNNER_TEMP/moodle-plugin-ci"
          rm -rf "$CI_DIR"
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci "$CI_DIR" ^4
          echo "$CI_DIR/bin" >> "$GITHUB_PATH"
          echo "$CI_DIR/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install test Moodle
        run: |
          rm -rf "$RUNNER_TEMP/moodle" "$RUNNER_TEMP/moodledata"
          moodle-plugin-ci install \
            --plugin ./plugin \
            --moodle "$RUNNER_TEMP/moodle" \
            --data "$RUNNER_TEMP/moodledata" \
            --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Upgrade savepoint validation
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: JavaScript / Grunt checks
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
