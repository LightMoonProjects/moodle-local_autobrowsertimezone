name: Moodle Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install test Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_501_STABLE

      - name: Generate canonical AMD artifacts
        run: |
          cd moodle
          npx grunt amd --root=public/local/autobrowsertimezone

      - name: Collect generated AMD artifacts
        run: |
          mkdir -p amd-artifacts
          cp moodle/public/local/autobrowsertimezone/amd/build/timezone.min.js amd-artifacts/
          cp moodle/public/local/autobrowsertimezone/amd/build/timezone.min.js.map amd-artifacts/

      - name: Upload generated AMD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-amd-build
          path: amd-artifacts/
          if-no-files-found: error

      - name: PHP lint
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        run: moodle-plugin-ci validate

      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning
